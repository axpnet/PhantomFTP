name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rust-ftp-tui
            asset_name: rust-ftp-tui-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rust-ftp-tui.exe
            asset_name: rust-ftp-tui-windows-amd64.exe

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-action@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build
      run: cargo build --release --target ${{ matrix.target }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  # Create .deb package for Linux
  build-deb:
    name: Build .deb Package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-action@stable

    - name: Install cargo-deb
      run: cargo install cargo-deb

    - name: Build .deb
      run: cargo deb

    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: rust-ftp-tui-deb
        path: target/debian/*.deb

  # Create release when tag is pushed
  release:
    name: Create Release
    needs: [build, build-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure
      run: ls -R artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/rust-ftp-tui-linux-amd64/rust-ftp-tui
          artifacts/rust-ftp-tui-windows-amd64.exe/rust-ftp-tui.exe
          artifacts/rust-ftp-tui-deb/*.deb
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
